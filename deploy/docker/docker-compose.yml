# IB Gateway plus the live trader, on one Docker network.
#
#   docker compose -f deploy/docker/docker-compose.yml up -d ib-gateway
#   docker compose -f deploy/docker/docker-compose.yml run --rm --no-deps qbs preflight
#
# Only the Gateway is a long-running service. The trader is three short phases
# that each run to completion, so it sits behind a profile and is invoked with
# `run --rm` -- `up` must never start it.
#
# Always pass --no-deps to `run`. Without it Compose re-evaluates the Gateway's
# configuration on every single phase, and since the Gateway reads the whole of
# .env, changing any variable in that file -- QBS_DRY_RUN, say -- makes its
# config hash differ and Compose recreates it. That throws away a logged-in
# session, which takes minutes to rebuild and may happen at 15:30 with the
# auction fifteen minutes away. The Gateway is `restart: unless-stopped` and
# already running, so there is nothing for `run` to start anyway.

name: qbs

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: ib-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRADING_MODE: paper
      READ_ONLY_API: "no"
      TZ: America/New_York
    ports:
      # Bound to 127.0.0.1, NOT 0.0.0.0. The API port has no authentication
      # beyond IB's trusted-IP list, and the VNC port has only a password --
      # neither belongs on a public interface. Reach them over an SSH tunnel.
      #
      # Container-side port is ${IBG_PAPER_PORT:-4004}: this image serves the
      # paper API on 4004, not the 4002 a host-installed Gateway uses. Confirm
      # yours with:
      #   docker exec ib-gateway cat /proc/net/tcp | grep -i ' 0A '
      # and read column 2 as hex -- 0FA2 is 4002, 0FA4 is 4004.
      - "127.0.0.1:4002:${IBG_PAPER_PORT:-4004}"
      - "127.0.0.1:5900:5900"
    networks:
      - qbsnet

  qbs:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: qbs-live:latest
    # Deliberately no container_name. Every phase is a `run --rm`, so Compose
    # names each one uniquely and two can coexist. With a fixed name they
    # cannot: a preflight that hung and was retried by systemd could still be
    # alive at 15:30, and the trade phase would then die on a name collision
    # rather than submit. Nothing needs to address this container by name.
    #
    # Keeps `docker compose up` from ever starting the trader. `run` enables
    # the profile automatically for the service it names.
    profiles:
      - cli
    # Run as the host user so files written into the bind-mounted var/ and
    # data/ are owned by you, not by root. Set QBS_UID/QBS_GID in .env.
    user: "${QBS_UID:-1000}:${QBS_GID:-1000}"
    depends_on:
      - ib-gateway
    environment:
      # Inside the network the Gateway is a hostname, not localhost. This is
      # the single most common thing to get wrong when moving a working
      # host-side script into a container.
      QBS_IB_HOST: ib-gateway
      # Container to container, so this is the port INSIDE the Gateway
      # container -- not the 4002 published to the host.
      QBS_IB_PORT: "${IBG_PAPER_PORT:-4004}"
      QBS_STATE_DIR: /app/var
      # The container runs as your host UID, which has no home directory in
      # the image, so yfinance cannot create its timezone cache under / and
      # logs two permission errors per run. Harmless -- it falls back to
      # fetching tz data each time -- but it is noise in the journal, and at
      # 15:30 you want a clean log where a real error stands out.
      HOME: /tmp
      QBS_NOTIONAL: "${QBS_NOTIONAL:-100000}"
      QBS_IB_ACCOUNT: "${QBS_IB_ACCOUNT:-}"
      # Leave DRY_RUN on until you have watched a few sessions.
      QBS_DRY_RUN: "${QBS_DRY_RUN:-1}"
      TZ: America/New_York
    # Note there is no `env_file: .env` here on purpose: the trader has no need
    # of the IB login, and passing it in would put the account password in the
    # environment of a container that never uses it.
    volumes:
      - ../../var:/app/var      # run log, state -- must persist
      - ../../data:/app/data    # price cache -- persists downloads
    networks:
      - qbsnet

networks:
  qbsnet:
    name: qbs-net
